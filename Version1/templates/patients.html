{% extends 'base.html' %}{% block content %}<section class="card"><h1>Search patient records</h1><form method="get"><label for="patient_id">Patient ID (UUID)</label><div class="row"><input id="patient_id" name="patient_id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" value="{{query}}" required><button style="flex:0">Search</button></div></form>{% if patient %}<p><strong>{{patient.first_name}} {{patient.last_name}}</strong> · <span class="id">{{patient.patient_id}}</span></p><a class="button" href="{{url_for('patient_detail',patient_id=patient.patient_id)}}">View record and history</a>{% endif %}</section><a class="button secondary" href="{{url_for('new_patient')}}">Register new patient</a>{% endblock %}
