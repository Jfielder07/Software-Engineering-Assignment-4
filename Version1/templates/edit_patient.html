{% extends 'base.html' %}{% block content %}<section class="card"><h1>Edit patient information</h1><p class="muted">Patient ID is immutable: <span class="id">{{patient.patient_id}}</span></p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>First name</label><input name="first_name" value="{{patient.first_name}}" required><label>Last name</label><input name="last_name" value="{{patient.last_name}}" required><label>Date of birth</label><input name="date_of_birth" type="date" value="{{patient.date_of_birth.isoformat()}}" required><label>Contact information</label><input name="contact_info" value="{{patient.contact_info}}" required><p><label><input class="check" type="checkbox" name="consent" value="yes" required> I confirm the patient has consented to these updates.</label></p><button>Save changes</button> <a href="{{url_for('patient_detail',patient_id=patient.patient_id)}}">Cancel</a></form></section>{% endblock %}
